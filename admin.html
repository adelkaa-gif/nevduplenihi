<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор расписания</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#fff8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292128;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#fff;border:1px solid #f1dfe7;border-radius:20px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{font-size:12px;color:#82747c;display:block;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #eadbe2;border-radius:11px;font-size:15px;box-sizing:border-box}button{border:0;border-radius:11px;padding:11px 15px;font-weight:700}.primary{background:#FFAACC;color:#5b3545}.danger{background:#ffe9ef;color:#b24d73}.edit{background:#fff0f6;color:#c76d91}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:13px 0;border-top:1px solid #f1e4e9}.muted{color:#81757c;font-size:13px}.msg{margin-top:10px;color:#c76d91;font-weight:600}.actions{display:flex;gap:7px;margin-top:8px}</style></head><body><div class="wrap"><h1>🌸 Редактор расписания</h1><div class="card" id="loginCard"><h3>Вход администратора</h3><div class="grid"><div><label>Email</label><input id="email" type="email"></div><div><label>Пароль</label><input id="password" type="password"></div></div><br><button class="primary" id="login">Войти</button><div class="msg" id="msg"></div></div><div id="panel" style="display:none"><div class="card"><div class="row"><h3 id="formTitle">Добавить пару</h3><button id="logout">Выйти</button></div><input type="hidden" id="editId"><div class="grid"><div><label>Дата</label><input id="date" type="date"></div><div><label>Номер пары</label><select id="num"><option value="1">1 — 09:00–10:30</option><option value="2">2 — 10:40–12:10</option><option value="3">3 — 12:40–14:10</option><option value="4">4 — 14:20–15:50</option><option value="5">5 — 16:00–17:30</option><option value="6">6 — 17:40–19:10</option></select></div><div><label>Предмет</label><input id="subject"></div><div><label>Преподаватель</label><input id="teacher"></div><div><label>Аудитория</label><input id="room"></div><div><label>Тип</label><select id="type"><option value="">—</option><option>ЛК</option><option>ПЗ</option><option>ЛР</option></select></div><div><label>Дистанционно?</label><select id="remote"><option value="false">Нет</option><option value="true">Да</option></select></div></div><br><button class="primary" id="save">Добавить</button> <button class="edit" id="cancel" style="display:none">Отмена</button><div class="msg" id="status"></div></div><div class="card"><div class="row"><h3>Расписание</h3><button id="refresh">Обновить</button></div><div id="items"></div></div></div></div><script>const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),times={1:"09:00–10:30",2:"10:40–12:10",3:"12:40–14:10",4:"14:20–15:50",5:"16:00–17:30",6:"17:40–19:10"},$=id=>document.getElementById(id);async function check(){const {data}=await sb.auth.getSession();$("loginCard").style.display=data.session?"none":"block";$("panel").style.display=data.session?"block":"none";if(data.session)load()}$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('msg').textContent=error?error.message:"";check()};$("logout").onclick=()=>sb.auth.signOut().then(check);function clearForm(){$('editId').value="";$('formTitle').textContent="Добавить пару";$('save').textContent="Добавить";$('cancel').style.display="none";$('subject').value="";$('teacher').value="";$('room').value="";$('type').value="";$('remote').value="false"}$('cancel').onclick=clearForm;$('save').onclick=async()=>{const n=+$('num').value,row={date:$('date').value,lesson_number:n,time:times[n],subject:$('subject').value.trim(),teacher:$('teacher').value.trim(),room:$('room').value.trim(),type:$('type').value,remote:$('remote').value==='true'};if(!row.date||!row.subject){$('status').textContent='Заполни дату и предмет';return}let error;if($('editId').value){({error}=await sb.from('lessons').update(row).eq('id',$('editId').value))}else{({error}=await sb.from('lessons').insert(row))}$('status').textContent=error?error.message:'Сохранено ✓';if(!error){clearForm();load()}};window.edit=async id=>{const {data,error}=await sb.from('lessons').select('*').eq('id',id).single();if(error)return alert(error.message);$('editId').value=id;$('formTitle').textContent='Редактировать пару';$('save').textContent='Сохранить';$('cancel').style.display='inline-block';$('date').value=String(data.date).slice(0,10);$('num').value=data.lesson_number;$('subject').value=data.subject||'';$('teacher').value=data.teacher||'';$('room').value=data.room||'';$('type').value=data.type||'';$('remote').value=data.remote?'true':'false';scrollTo({top:0,behavior:'smooth'})};window.del=async id=>{if(!confirm('Удалить эту пару?'))return;const {error}=await sb.from('lessons').delete().eq('id',id);if(error)alert(error.message);else load()};async function load(){const {data,error}=await sb.from('lessons').select('*').order('date').order('lesson_number');$('items').innerHTML=error?`<div class="muted">${error.message}</div>`:(data||[]).map(x=>`<div class="item"><b>${x.date}</b> · ${x.time}<br>${x.subject}<br><span class="muted">${x.teacher||''}${x.room?' · '+x.room:''}${x.remote?' · дистанционно':''}${x.type?' · '+x.type:''}</span><div class="actions"><button class="edit" onclick="edit('${x.id}')">✏️ Изменить</button><button class="danger" onclick="del('${x.id}')">🗑 Удалить</button></div></div>`).join('')};check();</script></body></html>
