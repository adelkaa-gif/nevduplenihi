<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка расписания</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
body{margin:0;background:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17181c;padding:24px}.wrap{max-width:900px;margin:auto}h1{margin-top:0}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 8px 28px #0000000b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{font-size:12px;color:#666;display:block;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;font-size:15px;box-sizing:border-box}button{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#7657ff;color:#fff}.danger{background:#ffe9e9;color:#b33}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:13px 0;border-top:1px solid #eee}.muted{color:#777;font-size:13px}.msg{margin-top:10px;color:#7657ff;font-weight:600}
</style></head>
<body><div class="wrap">
<h1>⚙️ Редактор расписания</h1>
<div class="card" id="loginCard"><h3>Вход администратора</h3><div class="grid"><div><label>Email</label><input id="email" type="email"></div><div><label>Пароль</label><input id="password" type="password"></div></div><br><button class="primary" id="login">Войти</button><div class="msg" id="msg"></div></div>
<div id="panel" style="display:none">
<div class="card"><div class="row"><h3>Добавить пару</h3><button id="logout">Выйти</button></div>
<div class="grid">
<div><label>Дата</label><input id="date" type="date"></div>
<div><label>Номер пары</label><select id="num"><option value="1">1 — 09:00–10:30</option><option value="2">2 — 10:40–12:10</option><option value="3">3 — 12:40–14:10</option><option value="4">4 — 14:20–15:50</option><option value="5">5 — 16:00–17:30</option><option value="6">6 — 17:40–19:10</option></select></div>
<div><label>Предмет</label><input id="subject"></div><div><label>Преподаватель</label><input id="teacher"></div>
<div><label>Аудитория</label><input id="room"></div><div><label>Тип</label><select id="type"><option value="">—</option><option>ЛК</option><option>ПЗ</option><option>ЛР</option></select></div>
<div><label>Дистанционно?</label><select id="remote"><option value="false">Нет</option><option value="true">Да</option></select></div>
</div><br><button class="primary" id="add">Добавить</button><div class="msg" id="status"></div></div>
<div class="card"><div class="row"><h3>Ближайшие пары</h3><button id="refresh">Обновить</button></div><div id="items"></div></div>
</div></div>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const times={1:"09:00–10:30",2:"10:40–12:10",3:"12:40–14:10",4:"14:20–15:50",5:"16:00–17:30",6:"17:40–19:10"};
const $=id=>document.getElementById(id);
async function check(){const {data}=await sb.auth.getSession();if(data.session){$("loginCard").style.display="none";$("panel").style.display="block";load()}else{$("loginCard").style.display="block";$("panel").style.display="none"}}
$("login").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("msg").textContent=error?error.message:"";check()};
$("logout").onclick=()=>sb.auth.signOut().then(check);
$("add").onclick=async()=>{const n=+$("num").value;const row={date:$("date").value,lesson_number:n,time:times[n],subject:$("subject").value.trim(),teacher:$("teacher").value.trim(),room:$("room").value.trim(),type:$("type").value,remote:$("remote").value==="true"};if(!row.date||!row.subject){$("status").textContent="Заполни дату и предмет";return}const {error}=await sb.from("lessons").insert(row);$("status").textContent=error?error.message:"Пара добавлена ✓";if(!error){$("subject").value="";$("teacher").value="";$("room").value="";load()}};
$("refresh").onclick=load;
async function load(){const {data,error}=await sb.from("lessons").select("*").order("date").order("lesson_number").limit(80);$("items").innerHTML=error?`<div class="muted">${error.message}</div>`:(data||[]).map(x=>`<div class="item"><div class="row"><div><b>${x.date}</b> · ${x.time}<br>${x.subject}<br><span class="muted">${x.teacher||""} ${x.room?`· ${x.room}`:""} ${x.remote?"· дистанционно":""} ${x.type?"· "+x.type:""}</span></div><button class="danger" onclick="del('${x.id}')">Удалить</button></div></div>`).join("")}
window.del=async id=>{if(confirm("Удалить эту пару?")){await sb.from("lessons").delete().eq("id",id);load()}};
check();
</script></body></html>
