<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Мои пары</title><script src="https://telegram.org/js/telegram-web-app.js?63"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>:root{--accent:#FFAACC;--soft:#fff0f6;--bg:#fff8fb;--card:#fff;--text:#292128;--muted:#8d8189;--line:#f1dfe7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:calc(15px + env(safe-area-inset-top)) 15px calc(24px + env(safe-area-inset-bottom))}.app{max-width:560px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:13px;color:var(--muted)}h1{font-size:30px;margin:3px 0 18px}.cal{border:1px solid var(--line);background:#fff;border-radius:15px;width:46px;height:46px;font-size:20px}.date{background:linear-gradient(135deg,#FFAACC,#ffc5dd);color:#5b3545;border-radius:25px;padding:18px;box-shadow:0 12px 30px #ffaacc45}.weekday{text-transform:capitalize;font-size:14px}.datebig{font-size:25px;font-weight:800;margin-top:3px}.nav{display:flex;gap:8px;margin-top:16px}.nav button{flex:1;border:0;border-radius:13px;padding:10px 5px;background:#ffffff99;color:#5b3545;font-weight:750}.nav button.active{background:#fff;color:#d77c9f}h2{font-size:14px;margin:22px 4px 10px}.lesson{display:grid;grid-template-columns:76px 1fr;gap:12px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:9px}.time{font-size:13px;font-weight:800;color:#df88aa}.num{font-size:11px;color:var(--muted);margin-top:4px}.subject{font-size:16px;font-weight:750;line-height:1.28}.meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}.tag{display:inline-block;background:var(--soft);color:#d5799c;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:800;margin-top:7px}.empty{text-align:center;background:#fff;border:1px solid var(--line);border-radius:19px;padding:30px 18px}.empty b{display:block;margin-bottom:5px}.empty span{color:var(--muted);font-size:13px}dialog{border:0;border-radius:22px;padding:0;width:min(92vw,380px);background:#fff;color:var(--text)}dialog::backdrop{background:#0006}.modal{padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;border-radius:10px;width:34px;height:34px;background:var(--soft);color:#d5799c;font-size:18px}input[type=date]{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:inherit;font-size:16px}.choose{width:100%;margin-top:10px;border:0;border-radius:13px;padding:13px;background:#FFAACC;color:#5b3545;font-weight:800}</style></head><body><div class="app"><div class="top"><div><div class="eyebrow">Учебное расписание</div><h1>Мои пары</h1></div><button class="cal" id="open">📅</button></div><section class="date"><div class="weekday" id="weekday"></div><div class="datebig" id="datebig"></div><div class="nav"><button id="prev">← Вчера</button><button id="today">Сегодня</button><button id="next">Завтра →</button></div></section><h2>Расписание на день</h2><main id="list"></main></div><dialog id="dlg"><div class="modal"><div class="modalhead"><b>Выбрать дату</b><button class="close" id="close">×</button></div><input type="date" id="date"><button class="choose" id="choose">Показать</button></div></dialog><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const client=(typeof SUPABASE_URL!=="undefined"&&!SUPABASE_URL.startsWith("ВСТАВЬ"))?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;let selected=new Date(),lessons=[];const days=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"],months=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],$=id=>document.getElementById(id);function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function parseLocal(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}async function load(){if(client){const {data,error}=await client.from("lessons").select("*").order("date").order("lesson_number");lessons=error?[]:(data||[])}else{try{lessons=await fetch("schedule.json").then(r=>r.json())}catch(e){lessons=[]}}render()}function render(){weekday.textContent=days[selected.getDay()];datebig.textContent=`${selected.getDate()} ${months[selected.getMonth()]} ${selected.getFullYear()}`;const k=dateKey(selected),items=lessons.filter(x=>String(x.date).slice(0,10)===k).sort((a,b)=>(a.lesson_number||0)-(b.lesson_number||0));$("list").innerHTML=items.length?items.map(x=>`<article class="lesson"><div><div class="time">${x.time}</div><div class="num">${x.lesson_number} пара</div></div><div><div class="subject">${x.subject}</div><div class="meta">${x.teacher?`👩‍🏫 ${x.teacher}<br>`:""}${x.remote?"🌐 Дистанционно":(x.room?`🏫 Аудитория ${x.room}`:"")}</div>${x.type?`<span class="tag">${x.type}</span>`:""}</div></article>`).join(""):`<div class="empty"><b>☕ Пар нет</b><span>На этот день расписание пустое.</span></div>`}function move(n){selected=new Date(selected);selected.setDate(selected.getDate()+n);render()}$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("today").onclick=()=>{selected=new Date();render()};$("open").onclick=()=>{$("date").value=dateKey(selected);$("dlg").showModal()};$("close").onclick=()=>$("dlg").close();$("choose").onclick=()=>{if($("date").value)selected=parseLocal($("date").value);$("dlg").close();render()};load();</script></body></html>
