<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Моё расписание</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{
      --bg:#f5f6fa; --card:#ffffff; --text:#17181c; --muted:#777b86;
      --accent:#7c5cff; --accent-soft:#eeeaff; --line:#ececf1;
      --shadow:0 8px 28px rgba(20,20,40,.07);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
      background:var(--tg-bg,#f5f6fa); color:var(--tg-text,#17181c);
      min-height:100vh; padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    .app{max-width:520px;margin:auto}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .eyebrow{font-size:13px;color:var(--muted);margin-bottom:4px}
    h1{font-size:29px;line-height:1.05;margin:0;letter-spacing:-.7px}
    .calendar-btn{
      width:46px;height:46px;border:0;border-radius:15px;background:var(--card);
      box-shadow:var(--shadow);font-size:21px;cursor:pointer;
    }
    .date-card{
      background:linear-gradient(135deg,var(--accent),#9b7dff);
      color:white;border-radius:25px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);
    }
    .date-row{display:flex;align-items:center;justify-content:space-between}
    .day-name{font-size:14px;opacity:.82}
    .date-number{font-size:25px;font-weight:750;margin-top:3px}
    .nav{display:flex;gap:8px;margin-top:16px}
    .nav button{
      flex:1;border:0;border-radius:13px;padding:10px 6px;background:rgba(255,255,255,.17);
      color:white;font-size:13px;font-weight:650;cursor:pointer;
    }
    .nav button.active{background:white;color:var(--accent)}
    .section-title{font-size:14px;font-weight:700;margin:22px 4px 10px}
    .lesson{
      display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:stretch;
      background:var(--card);border:1px solid var(--line);border-radius:19px;
      padding:14px;margin-bottom:9px;box-shadow:0 5px 18px rgba(20,20,40,.035);
    }
    .time{font-size:13px;font-weight:750;color:var(--accent);padding-top:2px}
    .subject{font-size:16px;font-weight:720;margin-bottom:5px}
    .meta{font-size:12px;color:var(--muted);line-height:1.45}
    .empty{background:var(--card);border-radius:19px;padding:28px 18px;text-align:center;box-shadow:var(--shadow)}
    .empty-icon{font-size:30px;margin-bottom:8px}.empty-title{font-weight:700}.empty-text{font-size:13px;color:var(--muted);margin-top:5px}
    dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--tg-text,#17181c);width:min(92vw,380px);box-shadow:0 20px 70px rgba(0,0,0,.22)}
    dialog::backdrop{background:rgba(0,0,0,.35)}
    .dialog-inner{padding:20px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .dialog-head strong{font-size:18px}.close{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;width:34px;height:34px;font-size:18px}
    input[type=date]{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font-size:16px;background:var(--card);color:inherit}
    .choose{width:100%;border:0;margin-top:10px;padding:13px;border-radius:13px;background:var(--accent);color:white;font-weight:700}
    @media (prefers-color-scheme:dark){
      :root{--bg:#17181c;--card:#22242a;--text:#fff;--muted:#a2a5af;--line:#30323a;--shadow:0 8px 28px rgba(0,0,0,.18)}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="eyebrow">Учебное расписание</div><h1>Мои пары</h1></div>
    <button class="calendar-btn" id="openCalendar" aria-label="Выбрать дату">📅</button>
  </div>

  <section class="date-card">
    <div class="date-row">
      <div><div class="day-name" id="dayName"></div><div class="date-number" id="dateNumber"></div></div>
      <div>🎓</div>
    </div>
    <div class="nav">
      <button id="prev">← Вчера</button>
      <button id="today" class="active">Сегодня</button>
      <button id="next">Завтра →</button>
    </div>
  </section>

  <div class="section-title">Расписание на день</div>
  <main id="schedule"></main>
</div>

<dialog id="calendar">
  <div class="dialog-inner">
    <div class="dialog-head"><strong>Выбрать дату</strong><button class="close" id="closeCalendar">×</button></div>
    <input id="dateInput" type="date">
    <button class="choose" id="chooseDate">Показать расписание</button>
  </div>
</dialog>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  // ЗАМЕНИТЕ ЭТИ ДАННЫЕ НА СВОЁ РАСПИСАНИЕ.
  // Формат: "YYYY-MM-DD": [{time, subject, teacher, room}]
  const schedule = {
    "2026-08-18": [
      {time:"09:00–10:30", subject:"Психология", teacher:"Иванова А.А.", room:"304"},
      {time:"10:40–12:10", subject:"Специальная педагогика", teacher:"Петрова Е.В.", room:"215"},
      {time:"12:30–14:00", subject:"Практикум", teacher:"Сидоров И.Н.", room:"118"}
    ],
    "2026-08-19": [
      {time:"10:40–12:10", subject:"Возрастная психология", teacher:"Иванова А.А.", room:"304"},
      {time:"12:30–14:00", subject:"Методика коррекционной работы", teacher:"Петрова Е.В.", room:"215"}
    ],
    "2026-08-20": []
  };

  const ruDays = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  const ruMonths = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  let selected = new Date();

  function key(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function render(){
    document.getElementById("dayName").textContent = ruDays[selected.getDay()];
    document.getElementById("dateNumber").textContent =
      `${selected.getDate()} ${ruMonths[selected.getMonth()]} ${selected.getFullYear()}`;

    const todayKey=key(new Date()), currentKey=key(selected);
    document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
    if(currentKey===todayKey) document.getElementById("today").classList.add("active");

    const items=schedule[currentKey] || [];
    const el=document.getElementById("schedule");
    if(!items.length){
      el.innerHTML=`<div class="empty"><div class="empty-icon">☕</div><div class="empty-title">Пар нет</div><div class="empty-text">На этот день расписание пока пустое.</div></div>`;
      return;
    }
    el.innerHTML=items.map(x=>`
      <article class="lesson">
        <div class="time">${x.time}</div>
        <div><div class="subject">${x.subject}</div>
        <div class="meta">👩‍🏫 ${x.teacher}<br>🏫 Аудитория ${x.room}</div></div>
      </article>`).join("");
  }

  function move(days){ selected=new Date(selected); selected.setDate(selected.getDate()+days); render(); }
  document.getElementById("prev").onclick=()=>move(-1);
  document.getElementById("next").onclick=()=>move(1);
  document.getElementById("today").onclick=()=>{selected=new Date();render()};

  const dialog=document.getElementById("calendar");
  document.getElementById("openCalendar").onclick=()=>{
    document.getElementById("dateInput").value=key(selected); dialog.showModal();
  };
  document.getElementById("closeCalendar").onclick=()=>dialog.close();
  document.getElementById("chooseDate").onclick=()=>{
    const v=document.getElementById("dateInput").value;
    if(v){ const [y,m,d]=v.split("-").map(Number); selected=new Date(y,m-1,d); render(); }
    dialog.close();
  };

  // Подстраиваемся под тему Telegram.
  if(tg){
    const p=tg.themeParams||{};
    if(p.bg_color) document.documentElement.style.setProperty("--tg-bg",p.bg_color);
    if(p.text_color) document.documentElement.style.setProperty("--tg-text",p.text_color);
    if(p.button_color) document.documentElement.style.setProperty("--accent",p.button_color);
  }
  render();
</script>
</body>
</html>
